name: release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test plugin
        run: node --test tests/scheduler.test.cjs

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest version ($VERSION) != tag (${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Generate checksums
        run: sha256sum main.js manifest.json styles.css > checksums.txt

      - name: Create GitHub Release with plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            checksums.txt
